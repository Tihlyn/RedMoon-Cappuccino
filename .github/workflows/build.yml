name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Copy release artifact
        run: Copy-Item RedMoonCappuccino/bin/x64/Release/RedMoonCappuccino/latest.zip RedMoonCappuccino.zip
        shell: pwsh

      - name: Extract full version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $match = [regex]::Match($tag, '^v(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$')

          if (-not $match.Success) {
            Write-Error "Invalid tag format '$tag'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.REVISION."
            exit 1
          }

          $major = $match.Groups[1].Value
          $minor = $match.Groups[2].Value
          $patch = $match.Groups[3].Value
          $revision = if ($match.Groups[4].Success) { $match.Groups[4].Value } else { '0' }

          $fullVer = "$major.$minor.$patch.$revision"

          if ($fullVer -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "Generated AssemblyVersion '$fullVer' is invalid. Expected exactly 4 numeric parts."
            exit 1
          }

          "full=$fullVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Update pluginmaster.json
        run: |
          $json = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          $json[0].AssemblyVersion = "${{ steps.version.outputs.full }}"
          $json[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $json | ConvertTo-Json -Depth 10 | Set-Content pluginmaster.json -Encoding UTF8NoBOM
        shell: pwsh

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet || git commit -m "chore: update manifest to ${{ github.ref_name }}"
          git push origin HEAD:refs/heads/main
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: RedMoonCappuccino.zip
