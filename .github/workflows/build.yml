name: Release

on:
  push:
    tags:
      - '*'

env:
  PLUGIN_NAME: RedMoonCappuccino

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PLUGIN_NAME }} ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          files: RedMoonCappuccino/bin/x64/Release/${{ env.PLUGIN_NAME }}.zip

      - name: Update pluginmaster.json
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          # Pad to 4-part version (x.x.x.x) as required by AssemblyVersion
          PARTS=$(echo "$VERSION" | tr '.' '\n' | wc -l)
          while [ "$PARTS" -lt 4 ]; do
            VERSION="${VERSION}.0"
            PARTS=$((PARTS + 1))
          done
          TIMESTAMP=$(date +%s)
          jq --arg ver "$VERSION" --argjson ts "$TIMESTAMP" \
            '.[0].AssemblyVersion = $ver | .[0].LastUpdate = $ts' \
            pluginmaster.json > tmp.json && mv tmp.json pluginmaster.json

      - name: Commit pluginmaster.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --staged --quiet || git commit -m "chore: bump pluginmaster.json to ${{ steps.tag.outputs.tag }}"
          git push origin HEAD:main
